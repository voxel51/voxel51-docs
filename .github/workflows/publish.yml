name: Publish Voxel51 Docs

on:
  push:
    branches:
      - main
    paths-ignore:
      - CONTRIBUTING.md
      - GETTING_STARTED_FORMAT.md
      - LICENSE
      - README.md
      - .gitignore

env:
  BUILT_DOCS_DIR: site/

jobs:
  publish-docs:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_publish.yml
    with:
      src-dir: ${{ env.BUILT_DOCS_DIR }}
    secrets: inherit
